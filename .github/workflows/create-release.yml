name: Create Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  SOLUTION_PATH: RenameMusic.sln
  PROJECT_PATH: RenameMusic/RenameMusic.csproj
  TEST_PROJECT_PATH: RenameMusic.Tests/RenameMusic.Tests.csproj

jobs:
  validate:
    name: Validate Release Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.TEST_PROJECT_PATH }} --configuration Release --no-build

  package:
    name: Package ${{ matrix.runtime }}
    needs: validate
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x86, win-x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained false
          --no-restore
          --output ./out/${{ matrix.runtime }}

      - name: Zip Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $zipPath = "dist/RenameMusic_${{ matrix.runtime }}.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "out/${{ matrix.runtime }}/*" -DestinationPath $zipPath

      - name: Upload Runtime Package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runtime }}
          path: dist/RenameMusic_${{ matrix.runtime }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Download Packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
